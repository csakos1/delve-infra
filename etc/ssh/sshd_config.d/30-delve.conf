# Delve terminal (T): the phone reaches OpenSSH on 2222 over the tailnet.
#
# On the tailnet address port 22 is taken by Tailscale SSH (tailscaled answers it
# itself, "none" auth plus the ACL check in the browser); it stays as the fallback
# for Termux. The app needs the real OpenSSH with its own key, so sshd listens on
# 2222 as well. firewalld keeps tailscale0 in the trusted zone and has no 2222 in
# the public zone: the port is reachable from the tailnet only.
#
# No Match block here: this file is included at the top of sshd_config, and a
# Match would also cover every line of the main file that follows it.
#
# The phone's key line in ~/.ssh/authorized_keys carries
#   from="100.64.0.0/10",no-agent-forwarding,no-X11-forwarding,no-port-forwarding
# (docs/decisions.md D-48). Check: sudo sshd -t && sudo sshd -T | grep -i '^port '
Port 22
Port 2222
