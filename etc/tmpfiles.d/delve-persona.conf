# Delve personal profile (P1): what the agent is told about the person it works for.
# delve-backend writes profile.md and topics/<name>.md here (the app edits them through the
# backend); the agent reads the topic files through its primary group (setgid keeps the
# group on new entries, the backend's UMask=0027 makes them 0640/0750) and cannot write.
# Other users see nothing. The content is personal: it lives here, in no repository
# (persona.example/ shows the format with an invented person).
# Install: /etc/tmpfiles.d/delve-persona.conf, then  sudo systemd-tmpfiles --create delve-persona.conf
d /var/lib/delve-persona 2750 delve agent -
d /var/lib/delve-persona/topics 2750 delve agent -
