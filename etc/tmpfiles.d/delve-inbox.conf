# Delve attachments (B6): files the user sends from the app. delve-backend writes them as
# <id>/<name>; the agent reads them through its primary group (setgid keeps the group on
# new entries, the backend's UMask=0027 makes them 0640/0750). Other users see nothing.
# The backend deletes them after DELVE_ATTACHMENT_RETENTION_DAYS (14); no tmpfiles age.
# Install: /etc/tmpfiles.d/delve-inbox.conf, then  sudo systemd-tmpfiles --create delve-inbox.conf
d /var/lib/delve-inbox 2750 delve agent -
