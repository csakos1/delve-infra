# Delve News (N1): delve-backend writes the list of feeds here (sources.json, 0640); the
# agent's no-agent collector (hermes/scripts/news_collect.py) reads it through its primary
# group (setgid keeps the group on new files) and cannot write. Other users see nothing.
# The list says what the operator reads: it lives here, in no repository.
# Install: /etc/tmpfiles.d/delve-news.conf, then  sudo systemd-tmpfiles --create delve-news.conf
d /var/lib/delve-news 2750 delve agent -
