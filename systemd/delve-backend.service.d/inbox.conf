# Attachments (delve-backend B6): the backend writes files the user sends into the inbox
# the agent reads (etc/tmpfiles.d/delve-inbox.conf, 2750 delve:agent). Images stay in the
# backend's own StateDirectory (/var/lib/delve/attachments) and need nothing here.
# "-": the backend still starts if the directory is missing (file uploads then fail).
# Install: /etc/systemd/system/delve-backend.service.d/inbox.conf, then
#   sudo systemctl daemon-reload && sudo systemctl restart delve-backend
[Service]
ReadWritePaths=-/var/lib/delve-inbox
