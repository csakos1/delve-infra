# Cards (delve-backend cards/ingest.py): the agent's card directory, read-only, at the
# path the backend reads (DELVE_CARDS_PATH=/run/delve/cards/events.jsonl). The agent's
# home stays 0700; the directory (0755) and events.jsonl (0644) are reachable only
# through this mount. "-": the backend still starts if the directory is missing.
# Install: /etc/systemd/system/delve-backend.service.d/cards.conf, then
#   sudo systemctl daemon-reload && sudo systemctl restart delve-backend
[Service]
BindReadOnlyPaths=-/home/agent/.hermes/cards:/run/delve/cards
