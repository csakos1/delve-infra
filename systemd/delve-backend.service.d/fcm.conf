# Push notifications (delve-backend push.py): the backend calls the FCM HTTP v1 API and
# Google's OAuth token endpoint over HTTPS. The base unit allows only localhost
# (IPAddressDeny=any + IPAddressAllow=localhost); an allow entry wins over the deny, so
# this opens outbound traffic. Every other restriction of the unit stays.
# Install: /etc/systemd/system/delve-backend.service.d/fcm.conf, then
#   sudo systemctl daemon-reload && sudo systemctl restart delve-backend
[Service]
IPAddressAllow=any
