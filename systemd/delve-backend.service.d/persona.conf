# Personal profile (delve-backend P1): the backend reads and writes the profile directory
# (etc/tmpfiles.d/delve-persona.conf, 2750 delve:agent); the agent only reads it.
# "-": the backend still starts if the directory is missing (runs then go without a profile).
# Install: /etc/systemd/system/delve-backend.service.d/persona.conf, then
#   sudo systemctl daemon-reload && sudo systemctl restart delve-backend
[Service]
ReadWritePaths=-/var/lib/delve-persona
