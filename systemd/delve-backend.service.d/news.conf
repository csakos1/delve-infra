# News (delve-backend N1): the backend writes the feed list for the agent's collector
# (etc/tmpfiles.d/delve-news.conf, 2750 delve:agent). The collector's batches come back
# through the card directory (cards.conf), read-only. "-": the backend still starts if the
# directory is missing (the collector then has nothing to fetch).
# Install: /etc/systemd/system/delve-backend.service.d/news.conf, then
#   sudo systemctl daemon-reload && sudo systemctl restart delve-backend
[Service]
ReadWritePaths=-/var/lib/delve-news
